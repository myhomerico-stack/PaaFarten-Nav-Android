name: Build På farten Nav

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PaaFarten-Nav-0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaaFarten-Nav-APK
          path: PaaFarten-Nav-0.1.0.apk
          if-no-files-found: error
